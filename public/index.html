<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#111312" />
    <meta
      name="description"
      content="SylvaPlan 村小丫 — your countryside travel companion. 发现乡村、挑选体验、规划每日行程。"
    />
    <title>SylvaPlan · 村小丫</title>
    <script src="/theme.js"></script>
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/workspace.css" />
    <link rel="stylesheet" href="/studio.css" />
    <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
    <link rel="stylesheet" href="/daylight.css" />
    <link rel="stylesheet" href="/toolbar.css" />
    <link rel="stylesheet" href="/catalogue.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">跳到主要内容</a>
    <header class="site-header" id="sidebar">
      <a href="#home" class="brand" aria-label="村小丫首页"
        ><img src="/assets/mark.svg" alt="" width="32" height="36" /><span
          translate="no"
          >SylvaPlan<small>村小丫</small></span
        ></a
      >
      <a class="new-trip" href="#plan"
        ><span data-icon="plus" aria-hidden="true"></span> 开始规划</a
      >
      <nav aria-label="主导航">
        <a href="#home" data-nav="home"><span data-icon="home"></span>新对话</a
        ><a href="#discover" data-nav="discover"
          ><span data-icon="compass"></span>发现乡村</a
        ><a href="#plan" data-nav="plan"
          ><span data-icon="chat"></span>我的规划</a
        ><a href="#saved" data-nav="saved"
          ><span data-icon="book"></span>我的行程</a
        >
        <button type="button" class="nav-assistant" data-action="chat">
          <span data-icon="chat"></span>问问小丫
        </button>
      </nav>
      <div class="sidebar-note">
        <span data-icon="leaf"></span>
        <p>下一次出发，<br />从一点灵感开始。</p>
      </div>
      <button
        class="account-button"
        id="account-button"
        data-action="account"
        aria-label="登录或查看账户"
      ></button>
    </header>
    <div class="workspace-top">
      <button
        id="sidebar-toggle"
        class="icon-button"
        data-action="sidebar-toggle"
        aria-label="收起侧栏"
        title="收起侧栏"
        aria-controls="sidebar"
        aria-expanded="true"
      >
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          aria-hidden="true"
        >
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <path d="M9 4v16m7-11-3 3 3 3" />
        </svg>
      </button>
      <a href="#home" class="chat-title"
        >新的旅行 <span aria-hidden="true">⌄</span></a
      >
      <div class="trip-context" aria-label="旅行条件">
        <button
          data-action="edit-trip"
          data-field="where"
          aria-controls="trip-editor"
          aria-expanded="false"
        >
          <span>去哪里</span><small data-trip-value="where"></small>
        </button>
        <button
          data-action="edit-trip"
          data-field="when"
          aria-controls="trip-editor"
          aria-expanded="false"
        >
          <span>什么时候</span><small data-trip-value="when"></small>
        </button>
        <button
          data-action="edit-trip"
          data-field="who"
          aria-controls="trip-editor"
          aria-expanded="false"
        >
          <span>和谁</span><small data-trip-value="who"></small>
        </button>
        <button
          data-action="edit-trip"
          data-field="budget"
          aria-controls="trip-editor"
          aria-expanded="false"
        >
          <span>预算</span><small data-trip-value="budget"></small>
        </button>
      </div>
      <section
        id="trip-editor"
        class="trip-editor"
        role="region"
        aria-labelledby="trip-editor-title"
        hidden
      ></section>
      <div class="top-actions">
        <button
          id="theme-toggle"
          class="theme-toggle icon-button"
          type="button"
          aria-label="切换日夜主题"
          title="切换日夜主题"
          aria-pressed="true"
        >
          <span data-icon="sun"></span>
        </button>
        <button
          class="mobile-account icon-button"
          data-action="account"
          aria-label="登录或查看账户"
        >
          <span data-icon="user"></span></button
        ><button
          id="language-toggle"
          class="language-toggle"
          type="button"
          aria-label="Switch to English"
          translate="no"
        >
          中 / EN</button
        ><button
          id="map-toggle"
          class="icon-button"
          type="button"
          aria-controls="map-pane"
          aria-expanded="false"
        >
          地图</button
        ><a href="#plan" class="create-trip"
          ><span data-icon="plus"></span><span>创建行程</span></a
        >
      </div>
    </div>
    <div id="mode-notice" class="mode-notice" hidden></div>
    <main id="content" tabindex="-1">
      <div class="loading">
        <span class="spinner"></span>
        <p>正在寻找乡村里的好时光…</p>
      </div>
    </main>
    <aside id="map-pane" class="map-pane" aria-label="目的地地图">
      <div id="travel-map" translate="no"></div>
      <div class="map-toolbar">
        <label class="map-search"
          ><span data-icon="search"></span
          ><select id="map-city" aria-label="查看城市范围">
            <option value="all">全部目的地</option>
            <option value="珠海">珠海</option>
            <option value="杭州">杭州</option>
            <option value="成都">成都</option>
            <option value="桂林">桂林</option>
            <option value="婺源">婺源</option>
          </select></label
        ><button id="map-reset" class="icon-button" aria-label="查看全部城市">
          <span data-icon="compass"></span>
        </button>
      </div>
      <div id="map-fallback" class="map-fallback" role="status">
        <span data-icon="compass"></span>
        <h2>正在展开地图</h2>
        <p>地图需要网络连接。你可以继续在左侧规划旅行。</p>
      </div>
      <div class="map-caption">
        <span class="map-dot"></span><span>城市范围参考 · 非村落导航点</span>
      </div>
    </aside>
    <footer class="site-footer">
      <a href="./case-study.html">项目设计说明</a
      ><button class="text-button" data-action="about">数据与功能说明</button
      ><small translate="no">© 2026 SylvaPlan</small>
    </footer>
    <button
      class="assistant-launcher"
      data-action="chat"
      aria-label="打开问问小丫"
    >
      <span id="assistant-icon"></span><span>问问小丫</span>
    </button>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <button
        class="dialog-close icon-button"
        data-action="close-dialog"
        aria-label="关闭窗口"
      ></button>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript
      >Please enable JavaScript. 请启用 JavaScript
      以浏览乡村和规划行程。</noscript
    >
  </body>
</html>
